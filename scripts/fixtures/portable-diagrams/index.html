<!doctype html>
<html lang="en" data-theme="light" data-pudl-persistence="host">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Independent Diagram Host</title>
  <link rel="stylesheet" href="../pudl/pudl.css"><link rel="stylesheet" href="../support/glyphs.css"><link rel="stylesheet" href="host.css">
  <script defer src="../support/yavc-util.js"></script><script defer src="../support/dialogs.js"></script>
  <script defer src="../pudl/pudl-menu.js"></script><script defer src="../pudl/pudl-commands.js"></script><script defer src="../pudl/pudl-toolbar.js"></script>
  <script defer src="../pudl/pudl-tabs.js"></script><script defer src="../support/doc-tabs.js"></script>
  <script defer src="../pudl/pudl-applets.js"></script><script defer src="../support/pudl-host-kit.js"></script><script defer src="../pudl/pudl-actions.js"></script>
  <script defer src="../pudl/pudl-dialog.js"></script><script defer src="../pudl/pudl-fields.js"></script><script defer src="../pudl/pudl-split.js"></script>
  <script defer src="host.js"></script>
</head>
<body>
  <header><h1>Independent Diagram Host</h1><p>This disposable host keeps synthetic resources in memory. Unsaved drafts disappear when it closes.</p></header>
  <main>
    <section><h2>First workspace</h2><div id="one" data-resource="memory:first.d2" data-applet="diagrams" data-applet-param="first" data-applet-flush></div></section>
    <section><h2>Second workspace</h2><div id="two" data-resource="memory:second.canvas" data-applet="diagrams" data-applet-param="second" data-applet-flush></div></section>
  </main>
</body></html>
