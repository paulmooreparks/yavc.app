# The site tests drive the real pages in Chromium, Firefox and WebKit against a freshly built server, one job for each browser
# (page-keeps reads a PDF with pdftotext). check.yml runs the checks and the
# unit tests. The tests are listed in scripts/site-tests.txt, which scripts/run-site-tests.mjs reads, and a test is added to that file
# when it is repaired. A failing test fails this workflow. A test that fails in one browser for a written reason is set aside in
# scripts/site-tests-set-aside.txt with a date and an owner, and every run prints what is set aside.
name: site tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-tests:
    name: site (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Firefox is set aside as a gate since 2026-11-28, owner: Yavc.App repair engineer until Paul assigns one. On the hosted runner about
    # one page load in fifty does not commit in Firefox within 30 seconds, at any address, so a different test fails in each run and no
    # single test can be set aside. Stress run 46127863568 reproduced it 14 times in 25 minutes, and its cause is not yet known
    # (docs/backlog.md, "Firefox page loads that do not commit"). The job still runs and shows red, and it does not fail the "site"
    # check. Remove continue-on-error when the cause is fixed.
    continue-on-error: ${{ matrix.engine == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the server and the two engines the pages load
        run: |
          go build -trimpath -o yavc ./cmd/yavc
          GOOS=js GOARCH=wasm go build -trimpath -o apps/md-engine/yavc-md.wasm ./cmd/yavc-md
          GOOS=js GOARCH=wasm go build -trimpath -o apps/diagram-kit/yavc-d2.wasm ./cmd/yavc-d2
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" apps/md-engine/wasm_exec.js
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" apps/diagram-kit/wasm_exec.js
      - name: Install Playwright, the browsers and pdftotext
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Site tests
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          SITE_SERVER: ${{ github.workspace }}/yavc
          SITE_ENGINE: ${{ matrix.engine }}
          SITE_JOBS: '2'
          SITE_LOGS: ${{ runner.temp }}/yavc-site-test-logs
        run: node scripts/run-site-tests.mjs
      - name: Logs of the tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-test-logs-${{ matrix.engine }}
          path: ${{ runner.temp }}/yavc-site-test-logs
          retention-days: 7

  # One check named "site" that says whether every gating browser passed. It runs after a failure too, since a skipped job counts as a pass.
  site:
    needs: site-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating browser to pass
        env:
          RESULT: ${{ needs.site-tests.result }}
        run: test "$RESULT" = success

  # The package tests load the built content package from a host of their own, as Dinah, GK Companion and PFO do, in all three
  # browsers. The tests are listed in scripts/package-tests.txt, which scripts/run-package-tests.mjs reads.
  package-tests:
    name: package (${{ matrix.engine }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        shard: [1, 2]
    env:
      PACKAGE_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the two engines and the content package
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -o apps/md-engine/yavc-md.wasm ./cmd/yavc-md
          GOOS=js GOARCH=wasm go build -trimpath -o apps/diagram-kit/yavc-d2.wasm ./cmd/yavc-d2
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" apps/md-engine/wasm_exec.js
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" apps/diagram-kit/wasm_exec.js
          go run ./cmd/yavc-content -out "$RUNNER_TEMP/package"
          go run ./cmd/yavc-content -profile docs -out "$RUNNER_TEMP/docs-package"
      - name: Install Playwright and the browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Package tests
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PACKAGE_LOGS: ${{ runner.temp }}/yavc-package-test-logs
          PACKAGE_SHARD: ${{ matrix.shard }}/2
          PACKAGE_RESULTS: ${{ runner.temp }}/yavc-package-test-logs/full.results.json
        run: node scripts/run-package-tests.mjs "$RUNNER_TEMP/package"
      # The docs profile, served as PFO serves its pages (docs/content-release-downloads.md, "Profiles"). If Docs starts to need a file the
      # profile leaves out, or an omitted feature stops saying so, this fails.
      - name: Docs profile test
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PACKAGE_LOGS: ${{ runner.temp }}/yavc-package-test-logs
          PACKAGE_RESULTS: ${{ runner.temp }}/yavc-package-test-logs/docs.results.json
          PACKAGE_PROFILE: docs
        run: node scripts/run-package-tests.mjs "$RUNNER_TEMP/docs-package" test-docs-profile.cjs
      - name: Logs of the tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-logs-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/yavc-package-test-logs
          retention-days: 7

  # Preserve the required check name. A skipped aggregate would count as success in branch protection, so it must run after failures too.
  package:
    needs: package-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-test-logs-*
          path: ${{ runner.temp }}/package-ledgers
      - name: Check the complete package ledger
        run: node scripts/check-package-ledger.mjs "$RUNNER_TEMP/package-ledgers"
      - name: Require every browser and shard to pass
        env:
          RESULT: ${{ needs.package-tests.result }}
        run: test "$RESULT" = success
