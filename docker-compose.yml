# yavc.app on this machine, behind the cloudflared tunnel, which routes
# yavc.app, www.yavc.app and *.yavc.app to 127.0.0.1:8400 (the tunnel's
# config.yml). The engine binds to the loopback address only.
#
# The container's own file system is read-only; the engine writes only the
# sessions, in the yavc-data volume, and /tmp is a small tmpfs for anything
# the runtime may want there. It keeps no Linux capability, cannot gain
# privileges, and has a memory limit.
services:
  yavc:
    build: .
    image: yavc-app:local
    container_name: yavc-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8400"
    volumes:
      - yavc-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: ["-domain", "yavc.app", "-secure", "-title", "yavc.app"]

volumes:
  yavc-data:
